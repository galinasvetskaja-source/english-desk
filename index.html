<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Desk</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script>try{document.documentElement.dataset.skin=localStorage.getItem('kd-skin-seen')||localStorage.getItem('kd-skin')||'doodle';}catch(e){document.documentElement.dataset.skin='doodle';}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700;800;900&family=Press+Start+2P&family=Exo+2:wght@400;500;700&family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one calm column, a summary strip, three tabs (Homework · Words · Lessons); homework opens in place; teacher controls appear inline only for the owner. */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --sunk:#E3EAE5; --ink:#1F2B27; --muted:#5B6964; --line:#D3DDD7;
  --accent:#2E5A78; --accent-soft:#DCE7EF; --marker:#F3E4A6;
  --ok:#2F7A55; --ok-soft:#DCEFE3; --warn:#8A6417; --warn-soft:#F6EBCF; --info:#2E5A78; --info-soft:#DCE7EF; --bad:#A3423A; --bad-soft:#F5DEDB;
  --teacher:#6B4E8A; --teacher-soft:#ECE4F3;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151C1A; --surface:#1D2623; --sunk:#25302C; --ink:#E5ECE8; --muted:#9AA9A3; --line:#33403B;
  --accent:#8DB7D6; --accent-soft:#233746; --marker:#5C5122;
  --ok:#7CC9A0; --ok-soft:#1F3A2C; --warn:#E2BF6E; --warn-soft:#3A3120; --info:#8DB7D6; --info-soft:#233746; --bad:#E59389; --bad-soft:#3E2523;
  --teacher:#C3A8E0; --teacher-soft:#2E2639; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151C1A; --surface:#1D2623; --sunk:#25302C; --ink:#E5ECE8; --muted:#9AA9A3; --line:#33403B;
  --accent:#8DB7D6; --accent-soft:#233746; --marker:#5C5122;
  --ok:#7CC9A0; --ok-soft:#1F3A2C; --warn:#E2BF6E; --warn-soft:#3A3120; --info:#8DB7D6; --info-soft:#233746; --bad:#E59389; --bad-soft:#3E2523;
  --teacher:#C3A8E0; --teacher-soft:#2E2639; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem);line-height:1.1}
h2{font-size:1.3rem}
h3{font-size:1.1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

header{display:flex;flex-direction:column;gap:6px}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);background:var(--teacher-soft);color:var(--teacher);font-size:.9rem}
.tbar strong{font-weight:700}
.tbar .sp{flex:1}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:.9rem}

.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat b.neg{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;align-self:flex-start;max-width:100%;overflow-x:auto}
nav.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:700;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

section{display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;gap:10px}
.empty{padding:24px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted)}

.hw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.hw-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.hw-top>div{min-width:0;flex:1 1 260px;display:flex;flex-direction:column;gap:2px}
.date{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-new{background:var(--sunk);color:var(--muted)}
.p-doing{background:var(--warn-soft);color:var(--warn)}
.p-done{background:var(--ok-soft);color:var(--ok)}
.p-checked{background:var(--info-soft);color:var(--info)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:700;font-size:.9rem;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.t{border-color:var(--teacher);color:var(--teacher);background:transparent}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn.danger.arm{background:var(--bad-soft);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.note{display:flex;flex-direction:column;gap:4px}
.note textarea{width:100%;min-height:56px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);resize:vertical}
.quote{padding:8px 12px;border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:0 8px 8px 0;font-size:.9rem}

/* homework player */
.player{display:flex;flex-direction:column;gap:16px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.task .instr{color:var(--muted);font-size:.95rem}
.rule{padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:.92rem}
.passage{padding:14px 16px;background:var(--bg);border-radius:8px;border:1px solid var(--line);max-width:68ch}
.passage p+p{margin-top:.6em}
.items{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.item{padding:10px 12px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:8px}
.item.good{border-color:var(--ok);background:var(--ok-soft)}
.item.bad{border-color:var(--bad);background:var(--bad-soft)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-size:.95rem}
.opt input{margin:0;accent-color:var(--accent)}
.gapline{line-height:2.1}
.gapline input{width:9.5em;max-width:60%;border:0;border-bottom:2px solid var(--accent);background:var(--bg);padding:2px 6px;border-radius:4px 4px 0 0}
.bank{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.bank span{padding:3px 10px;border-radius:999px;background:var(--marker);font-size:.92rem}
.txt{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
textarea.txt{min-height:64px;resize:vertical}
.match select{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);max-width:100%}
.fix{font-size:.88rem;color:var(--muted)}
.fix b{color:var(--ink)}
.linkcard{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.finish{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:16px 18px;border-radius:var(--r);background:var(--ok-soft);color:var(--ok)}

/* teacher review */
.ans{display:inline-block;padding:0 6px;border-radius:4px;font-weight:700}
.ans.ok{background:var(--ok-soft);color:var(--ok)}
.ans.no{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.ans.miss{background:var(--sunk);color:var(--muted);font-weight:400}
.corr{color:var(--ok);font-weight:700}
.later{font-size:.85rem;color:var(--muted)}
.scorebox{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;padding:14px 16px;border-radius:var(--r);background:var(--teacher-soft);color:var(--teacher)}
.scorebox b{font-family:var(--f-display);font-size:1.4rem}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search],.tools select{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);min-width:0}
.tools input[type=search]{flex:1 1 180px}
.words{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group-h{padding:10px 16px;background:var(--sunk);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.w{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--line)}
.w:first-child{border-top:0}
.w .term{font-weight:700;font-size:1.05rem}
.w .term mark{background:var(--marker);color:inherit;padding:0 3px;border-radius:3px}
.w .ex{font-style:italic;color:var(--muted);font-size:.92rem}
.w .side{grid-row:1/span 3;grid-column:2;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.chk input{width:18px;height:18px;accent-color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 22px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.card .meaning{font-size:1.25rem;max-width:34ch}
.card .answer{font-family:var(--f-display);font-size:1.8rem;background:var(--marker);padding:2px 12px;border-radius:6px}

/* balance */
.balance{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.balance .big{font-family:var(--f-display);font-size:2.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.balance .big.neg{color:var(--bad)}
.balance.neg{border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:3px 10px;border-radius:999px;background:var(--sunk);font-size:.88rem;font-variant-numeric:tabular-nums}
.chips.unpaid span{background:var(--bad-soft);color:var(--bad);font-weight:700}
.pk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pk summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.pk summary::-webkit-details-marker{display:none}
.pk summary::after{content:"▾";margin-left:auto;color:var(--muted)}
.pk[open] summary::after{content:"▴"}
.pk .body{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.pk .plus{font-family:var(--f-display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.meter{display:flex;gap:3px;flex-wrap:wrap}
.meter i{width:14px;height:14px;border-radius:4px;background:var(--accent)}
.meter i.free{background:var(--sunk);border:1px solid var(--line)}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
thead th{border-top:0;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}



.review{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.review-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.review-main .big{font-family:var(--f-display);font-weight:700;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.review-actions{display:flex;flex-wrap:wrap;gap:8px}
.setbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.setgroup{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.setrows{display:flex;flex-direction:column;gap:8px;align-self:stretch}
.setrow{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.setrow input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.setrow>span{display:flex;flex-direction:column;gap:2px;min-width:0}
nav.tabs button.tab-gear{padding:8px 14px;font-size:1.05rem;line-height:1.5}
.seg{display:inline-flex;background:var(--sunk);padding:3px;border-radius:999px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:700;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);min-width:0}
.mode:hover:not([disabled]){border-color:var(--accent)}
.mode[disabled]{opacity:.5;cursor:default}
.mode-t{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.mode-d{color:var(--muted);font-size:.9rem}
.mode-n{font-size:.8rem;color:var(--accent);font-weight:700;margin-top:4px}
.res{font-weight:700;min-height:1.5em}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.ctx-sent{font-size:1.2rem;line-height:2.2;max-width:36ch}
.txt.inline{display:inline-block;width:9em;max-width:70%;margin:0 4px;border:0;border-bottom:2px solid var(--accent);border-radius:4px 4px 0 0;text-align:center}
.card.ok{border-color:var(--ok)}.card.bad{border-color:var(--bad)}
.speedbar{display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px}
.timer{font-family:var(--f-display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.bar.wide{width:100%;margin:0}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.btn.choice{justify-content:center;padding:12px 10px;border-radius:10px;font-size:1rem;white-space:normal}
.pairs{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
.pcol{display:flex;flex-direction:column;gap:8px}
.pair{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;min-height:48px;font-size:.95rem}
.pcol:first-child .pair{font-weight:700}
.pair.sel{border-color:var(--accent);background:var(--accent-soft)}
.pair.wrong{border-color:var(--bad);background:var(--bad-soft)}
.pair.gone{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);opacity:.55;cursor:default}
.cxwrap{overflow-x:auto;padding:4px 0}
.cx{--cs:min(36px, calc((100vw - 48px) / var(--cols)));display:grid;grid-template-columns:repeat(var(--cols),var(--cs));grid-auto-rows:var(--cs);gap:2px;width:max-content;margin:0 auto}
.cx-b{background:transparent}
.cx-c{position:relative;background:var(--surface);border:1.5px solid var(--ink);border-radius:3px}
.cx-c input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-weight:700;font-size:calc(var(--cs) * .5);text-transform:uppercase;padding:0;caret-color:var(--accent)}
.cx-c input:focus{outline:none;background:var(--marker)}
.cx-c.ok{background:var(--ok-soft)}.cx-c.no{background:var(--bad-soft)}
.cx-n{position:absolute;top:0;left:2px;font-size:.55rem;line-height:1;color:var(--muted);pointer-events:none}
.cluegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.clues ol{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.clue{border:0;background:transparent;text-align:left;padding:4px 0;font-size:.92rem;color:var(--ink)}
.clues li.ok .clue{color:var(--ok);text-decoration:line-through}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.slot{width:2.1em;height:2.4em;border-bottom:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:1.3rem;text-transform:uppercase}
.slots.ok .slot{border-color:var(--ok);color:var(--ok)}.slots.bad .slot{border-color:var(--bad);color:var(--bad)}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tile{width:2.6em;height:2.6em;border-radius:10px;border:1px solid var(--line);background:var(--marker);font-family:var(--f-display);font-weight:700;font-size:1.15rem;text-transform:uppercase}
.tile[disabled]{opacity:.25}
@media (max-width:520px){.cluegrid{grid-template-columns:1fr}.pairs{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}.pair{font-size:.85rem;padding:8px}}
details.add{border:1.5px dashed var(--teacher);border-radius:var(--r);padding:10px 14px;color:var(--teacher)}
details.add summary{cursor:pointer;font-weight:700}
details.add form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px;color:var(--ink)}
details.add label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
details.add label.full{grid-column:1/-1}
details.add input,details.add textarea,details.add select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;width:100%}
details.add .actions{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.addrow{display:flex;flex-wrap:wrap;gap:10px}
.addrow details.add{flex:1 1 280px}
.sbar{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--teacher-soft);color:var(--teacher);font-size:.92rem;margin-bottom:10px}
.sbar select,.sbar input{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;max-width:100%}
.sbar .sp{flex:1}
.sbar .invite{flex:1 1 220px;font-size:.85rem}
.sbar #st-name{flex:1 1 180px}
.sbar select{flex:1 1 160px}
details.add textarea.big{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:.85rem}
.err{color:var(--bad);font-size:.85rem;grid-column:1/-1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:520px){
  .summary{grid-template-columns:1fr 1fr}
  .summary .stat:last-child{grid-column:1/-1}
  details.add form{grid-template-columns:1fr}
  .w{grid-template-columns:1fr}
  .w .side{grid-row:auto;grid-column:auto;flex-direction:row;align-items:center;justify-content:space-between}
  .task{padding:14px}
  nav.tabs{gap:2px}
  nav.tabs button{padding:8px 9px}
  nav.tabs button.tab-gear{padding:8px 11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="wrap">
  <header>
    <span class="label" id="eyebrow">Your English desk</span>
    <h1 id="hello">Hi!</h1>
    <p class="muted" id="sub">Your homework, words from our lessons and your lesson balance, all in one place.</p>
  </header>
  <div id="tbar"></div>
  <div id="notice"></div>
  <div class="summary" id="summary"></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" id="tab-homework" data-tab="homework">Homework</button>
    <button role="tab" id="tab-words" data-tab="words">Words</button>
    <button role="tab" id="tab-lessons" data-tab="lessons">Lessons</button>
    <button role="tab" id="tab-settings" data-tab="settings" class="tab-gear" aria-label="Settings" title="Settings">⚙</button>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const S={db:null,user:null,ready:false,role:'loading',uid:null,preview:false,
  hw:[],words:[],pays:[],lessons:[],
  prog:{hw:{},known:{},wstat:{},best:{},srs:{}},allProg:{hw:{},known:{},wstat:{},best:{},srs:{}},
  myHw:{},touched:{},allHw:{},
  tab:'homework',openHw:null,q:'',lesson:'all',practice:null,noWrite:false,drafts:{},open:{},
  students:[],pending:[],sid:null,student:null,offline:false,guestName:'',err:null};
const $=s=>document.querySelector(s);
function el(tag,attrs,...kids){const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');else e.setAttribute(k,v);}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_RU=['янв.','февр.','марта','апр.','мая','июня','июля','авг.','сент.','окт.','нояб.','дек.'];
function fmtDate(d,short){if(!d)return'';const [y,m,dd]=String(d).split('-').map(Number);if(!m)return d;
  if(RU())return dd+' '+MONTHS_RU[m-1]+(short?'':' '+y);return dd+' '+MONTHS[m-1]+(short?'':' '+y);}
function fmtStamp(iso){try{return new Date(iso).toLocaleString(RU()?'ru-RU':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}
const isTeacherView=()=>S.role==='teacher'&&!S.preview;
const progView=()=>S.role==='teacher'?S.allProg:S.prog;
const hwView=()=>S.role==='teacher'?S.allHw:S.myHw;
const canSaveOwn=()=>S.role==='student'&&!S.noWrite&&!!S.db&&!!S.uid;
// Язык интерфейса: учитель всегда видит русский; ученик (и учитель в режиме «глазами ученика») — язык из настроек ученика.
const curStudent=()=>S.role==='teacher'?S.students.find(s=>s.id===S.sid):S.student;
const uiLang=()=>isTeacherView()?'ru':(((curStudent()||{}).lang)==='ru'?'ru':'en');
const RU=()=>uiLang()==='ru';
const L=(en,ru)=>RU()?ru:en;
function ruPl(n,one,few,many){n=Math.abs(n);const a=n%10,b=n%100;if(a===1&&b!==11)return one;if(a>=2&&a<=4&&(b<12||b>14))return few;return many;}
function ruLessons(n){return ruPl(n,'урок','урока','уроков');}
const nWords=n=>n+' '+(RU()?ruPl(n,'слово','слова','слов'):(Math.abs(n)===1?'word':'words'));
function nLessons(n){return RU()?(n+' '+ruLessons(n)):(n+' '+(Math.abs(n)===1?'lesson':'lessons'));}
function signed(n){return n<0?'−'+Math.abs(n):String(n);}
const clone=o=>JSON.parse(JSON.stringify(o));

let pendingRender=false;
function safeRender(){const a=document.activeElement;if(a&&(a.tagName==='TEXTAREA'||a.tagName==='SELECT'||(a.tagName==='INPUT'&&!['checkbox','radio'].includes(a.type)))){pendingRender=true;return;}render();}
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender){pendingRender=false;safeRender();}},200);});

/* ---------- server (Google Apps Script) ---------- */
const CFG=window.DESK_CONFIG||{};
const TG=window.Telegram&&window.Telegram.WebApp;
const tgOK=v=>{try{return!!TG&&TG.isVersionAtLeast(v);}catch(e){return false;}};
async function api(action,payload){
  if(!CFG.api)throw Object.assign(new Error('В config.js не указан адрес сервера'),{code:'setup'});
  let r,j;
  try{r=await fetch(CFG.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({action,initData:(TG&&TG.initData)||''},payload||{}))});}
  catch(e){throw Object.assign(new Error('offline'),{code:'offline'});}
  try{j=await r.json();}catch(e){throw Object.assign(new Error('Сервер ответил странно (код '+r.status+')'),{code:'server'});}
  if(j&&j.error){const m=String(j.error).match(/^(\w+): (.*)$/);throw Object.assign(new Error(m?m[2]:j.error),{code:m?m[1]:'server'});}
  return j;
}
const COLL={homework:'hw',words:'words',lessons:'lessons',payments:'pays'};
const DB={
  doc(path){const p=path.split('/');return{
    set:data=>p[0]==='progress'&&p.length===2?api('saveProgress',{data}):api('saveHw',{hw:p[3],data}),
    update:data=>api('update',{coll:p[0],id:p[1],data}).then(r=>{const a=S[COLL[p[0]]];const i=a.findIndex(x=>x.id===p[1]);if(i>=0)a[i]=r.item;render();}),
    delete:()=>api('del',{coll:p[0],id:p[1]}).then(()=>{S[COLL[p[0]]]=S[COLL[p[0]]].filter(x=>x.id!==p[1]);render();})};},
  collection(name){return{add:data=>api('add',{coll:name,student:S.sid,data}).then(r=>{S[COLL[name]].push(r.item);render();})};}
};

/* ---------- writes (with offline retry) ---------- */
const W={};
const PKEY=()=>'desk-pending-'+S.uid;
function readPending(){try{return JSON.parse(localStorage.getItem(PKEY())||'{}')||{};}catch(e){return{};}}
function markPending(path,data){try{const m=readPending();if(data===undefined)delete m[path];else m[path]=data;localStorage.setItem(PKEY(),JSON.stringify(m));}catch(e){}}
const isPending=path=>{const w=W[path];return!!w&&!!(w.busy||w.again||w.t||w.retry);};
function queueWrite(path,getData,delay){const w=W[path]||(W[path]={busy:false,again:false,t:null});w.get=getData;clearTimeout(w.t);
  w.t=setTimeout(()=>{w.t=null;runWrite(path);},delay==null?500:delay);}
async function runWrite(path){const w=W[path];if(w.busy){w.again=true;return;}w.busy=true;w.retry=false;
  const data=clone(w.get());markPending(path,data);
  try{await S.db.doc(path).set(data);if(!w.again)markPending(path,undefined);if(S.offline){S.offline=false;renderNotice();}}
  catch(e){w.busy=false;w.again=false;w.retry=true;
    if(!S.offline){S.offline=true;renderNotice();}
    clearTimeout(w.t);w.t=setTimeout(()=>{w.t=null;runWrite(path);},e&&e.code==='offline'?8000:20000);return;}
  w.busy=false;if(w.again){w.again=false;runWrite(path);}}
window.addEventListener('online',()=>{for(const p in W){const w=W[p];if(w.retry&&!w.busy){clearTimeout(w.t);w.t=null;runWrite(p);}}});
function flushPending(){const m=readPending();
  for(const path in m){const parts=path.split('/');
    if(parts.length===2){S.prog=normProg(m[path]);queueWrite(path,()=>S.prog,0);}
    else if(parts.length===4){const id=parts[3];S.myHw[id]=m[path];S.touched[id]=true;saveHw(id);}}}
const saveProg=()=>{if(canSaveOwn())queueWrite('progress/'+S.uid,()=>S.prog,0);};
const saveHw=id=>{if(canSaveOwn())queueWrite('progress/'+S.uid+'/hw/'+id,()=>{const r=Object.assign({},S.myHw[id]);delete r.dirty;return r;});};
function setHw(id,patch){const cur=S.prog.hw[id]||{};S.prog.hw[id]=Object.assign({},cur,patch,{at:new Date().toISOString()});render();saveProg();}
function setKnown(id,v){if(v)S.prog.known[id]=true;else delete S.prog.known[id];render();saveProg();}
async function tWrite(fn,ok){try{await fn();if(ok)toast(ok);}catch(e){toast('Не сохранилось: '+(e&&e.message?e.message:'ошибка'));}}

/* ---------- homework engine ---------- */
const norm=s=>String(s==null?'':s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'').trim();
function gapParts(s){return String(s).split(/\{\{(.+?)\}\}/);} // even=text, odd=answers "a|b"
function keysOf(task,ti){const out=[];(task.items||[]).forEach((it,ii)=>{
  if(task.type==='gap'){gapParts(it.s).forEach((p,pi)=>{if(pi%2)out.push({k:'t'+ti+'-i'+ii+'-g'+((pi-1)/2),ok:p.split('|')});});}
  else if(task.type==='tf')out.push({k:'t'+ti+'-i'+ii,ok:[it.a?'T':'F']});
  else if(task.type==='choice')out.push({k:'t'+ti+'-i'+ii,ok:[String(it.a)]});
  else if(task.type==='match')out.push({k:'t'+ti+'-i'+ii,ok:[it.r]});
  else if(task.type==='transform')out.push({k:'t'+ti+'-i'+ii,ok:[].concat(it.a)});
  else if(task.type==='open')out.push({k:'t'+ti+'-i'+ii,open:true});
});return out;}
const gradable=t=>['gap','tf','choice','match','transform'].includes(t.type);
function isRight(key,val){if(val==null||val==='')return false;return key.ok.some(o=>norm(o)===norm(val));}
function niceAnswer(task,key){if(task.type==='tf')return key.ok[0]==='T'?L('True','Верно'):L('False','Неверно');
  if(task.type==='choice'){const ii=+key.k.split('-i')[1];return task.items[ii].o[+key.ok[0]];}
  return key.ok[0];}
function niceVal(task,key,val){if(val==null||val==='')return'';if(task.type==='tf')return val==='T'?L('True','Верно'):L('False','Неверно');
  if(task.type==='choice'){const ii=+key.k.split('-i')[1];const o=task.items[ii].o[+val];return o==null?val:o;}return val;}
function scoreOf(h,rec,which){let ok=0,tot=0;(h.tasks||[]).forEach((t,ti)=>{if(!gradable(t))return;keysOf(t,ti).forEach(k=>{tot++;if(isRight(k,(rec[which]||{})[k.k]))ok++;});});return{ok,tot};}
function hwRec(id){const r=S.myHw[id]||(S.myHw[id]={state:'new',cur:{},first:{},checked:{}});r.cur=r.cur||{};r.first=r.first||{};r.checked=r.checked||{};return r;}
function touchHw(id){S.touched[id]=true;const r=hwRec(id);if(!r.state||r.state==='new'){r.state='doing';r.started=new Date().toISOString();}}
function maybeAutoFinish(h){const r=hwRec(h.id);if(r.state==='done')return;
  const all=(h.tasks||[]).every((t,ti)=>{if(gradable(t))return!!r.checked[ti];if(t.type==='open')return keysOf(t,ti).every(k=>String(r.cur[k.k]||'').trim());return true;});
  if(all)finishHw(h,true);}
function finishHw(h,auto){const r=hwRec(h.id);
  (h.tasks||[]).forEach((t,ti)=>{keysOf(t,ti).forEach(k=>{if(!(k.k in r.first))r.first[k.k]=r.cur[k.k]==null?'':r.cur[k.k];});});
  r.state='done';r.finished=new Date().toISOString();saveHw(h.id);render();
  toast(L('Homework finished!','Домашка готова!'));}
function statusOf(h){
  if(h.checked)return['p-checked',L('Checked by teacher','Проверено')];
  let st;
  if(h.tasks){st=(hwView()[h.id]||{}).state;}else st=(progView().hw[h.id]||{}).state;
  if(st==='done')return['p-done',L('Done','Сделано')];
  if(st==='doing')return['p-doing',L('In progress','В процессе')];
  return['p-new',L('Not started','Не начато')];}

/* ---------- render ---------- */
const stName=()=>S.role==='teacher'?((S.students.find(s=>s.id===S.sid)||{}).name||''):((S.student||{}).name||'');
const firstName=()=>String(stName()||S.guestName||'').split(' ')[0];
function normProg(v){v=v||{};return{hw:Object.assign({},v.hw),known:Object.assign({},v.known),wstat:Object.assign({},v.wstat),best:Object.assign({},v.best),srs:Object.assign({},v.srs)};}
function setBack(){if(!tgOK('6.1'))return;try{(S.openHw||S.practice)?TG.BackButton.show():TG.BackButton.hide();}catch(e){}}
function gateScreen(){
  const bot=CFG.bot?'@'+CFG.bot:'the bot';
  if(S.role==='loading')return el('div',{class:'empty'},'Loading… / Загрузка…');
  if(S.role==='outside')return el('div',{class:'card'},el('h2',null,'Open this page in Telegram'),
    el('p',{class:'muted'},'This desk works inside Telegram. Open '+bot+' and tap the button there.'),
    el('p',{class:'muted small'},'Кабинет открывается только внутри Telegram: откройте '+bot+' и нажмите кнопку.'),
    CFG.bot?el('a',{class:'btn primary',href:'https://t.me/'+CFG.bot},'Open '+bot):null);
  if(S.role==='guest')return el('div',{class:'card'},el('h2',null,'Hi'+(S.guestName?', '+S.guestName:'')+'!'),
    el('p',{class:'muted'},'Your desk is not connected yet. Please ask your teacher for your personal link and open it.'),
    el('p',{class:'muted small'},'Кабинет ещё не подключён. Попросите у преподавателя личную ссылку и откройте её, или напишите преподавателю, что вы уже здесь.'),
    el('button',{class:'btn',type:'button',id:'guest-retry',onclick:boot},'Try again'));
  if(S.role==='error'){const e=S.err||{};
    const msg=e.code==='offline'?'No internet connection. / Нет связи с интернетом.':e.code==='auth'?'Telegram check failed: '+e.message+'. Close the desk and open it again.':(e.message||'Something went wrong.');
    return el('div',{class:'card'},el('h2',null,'Could not open the desk'),el('p',{class:'muted'},msg),
      el('button',{class:'btn primary',type:'button',id:'err-retry',onclick:boot},'Try again'));}
  if(S.role==='teacher'&&!S.students.length&&!S.preview)return el('div',{class:'card'},el('h2',null,'Добро пожаловать!'),
    el('p',{class:'muted'},'Добавьте первого ученика в фиолетовой панели выше. Потом отправьте ему ссылку-приглашение: он откроет её в Telegram и сразу попадёт в свой кабинет.'));
  return null;
}
function render(){
  const gate=gateScreen();
  $('#summary').hidden=!!gate;$('#tabs').hidden=!!gate;setBack();
  if(gate){renderTop();$('#main').replaceChildren(gate);return;}
  renderTop();renderSummary();
  document.querySelectorAll('#tabs button').forEach(b=>{b.setAttribute('aria-selected',b.dataset.tab===S.tab?'true':'false');
    if(b.dataset.tab==='settings'){const t=L('Settings','Настройки');b.textContent='⚙';b.title=t;b.setAttribute('aria-label',t);return;}
    b.textContent={homework:L('Homework','Домашка'),words:L('Words','Слова'),lessons:L('Lessons','Занятия')}[b.dataset.tab];});
  const m=$('#main');m.replaceChildren();
  if(S.tab==='homework')m.append(S.openHw?renderHwOpen():renderHomework());
  else if(S.tab==='words')m.append(renderWords());
  else if(S.tab==='settings')m.append(renderSettings());
  else m.append(renderLessons());
}
function renderTop(){
  const tb=$('#tbar');tb.replaceChildren();
  if(S.role==='teacher'){
    if(!S.preview)tb.append(studentBar());
    if(S.sid)tb.append(el('div',{class:'tbar'},
      el('span',null,el('strong',{text:S.preview?'Просмотр глазами ученика':'Режим преподавателя'}),S.preview?' — так страницу видит ученик, сохранение отключено.':' — эту полосу и кнопки управления видите только вы.'),
      el('span',{class:'sp'}),
      el('button',{class:'btn t',id:'preview-toggle',onclick:()=>{S.preview=!S.preview;S.practice=null;render();}},S.preview?'Вернуться в режим учителя':'Посмотреть глазами ученика')));
    $('#eyebrow').textContent=S.preview?L('Your English desk','Мой английский'):'Кабинет ученика';
    $('#hello').textContent=S.preview?L('Hi, ','Привет, ')+firstName()+'!':(stName()||'Ваши ученики');
    $('#sub').textContent=S.preview?subText():'Домашка, слова и баланс занятий. Ученик видит эту же страницу '+(((curStudent()||{}).lang)==='ru'?'на русском':'на английском')+', без кнопок управления.';
  }else{
    $('#eyebrow').textContent=L('Your English desk','Мой английский');
    $('#hello').textContent=firstName()?L('Hi, ','Привет, ')+firstName()+'!':L('Hi!','Привет!');
    $('#sub').textContent=subText();
  }
  document.documentElement.lang=uiLang();
  applySkin();
  renderNotice();
}
/* ---------- skins: doodle · game · elegant ---------- */
const SKINS=[['doodle','Doodles','Рисунки'],['game','Game','Игра'],['elegant','Elegant','Элегантный']];
const SKIN_IDS=SKINS.map(s=>s[0]);
// Учитель выбирает свой вид на этом устройстве; у ученика стиль хранится на сервере (так его видят и ученик, и учитель).
function ownSkin(){try{const v=localStorage.getItem('kd-skin');return SKIN_IDS.includes(v)?v:null;}catch(e){return null;}}
function skinOf(){
  if(S.role==='teacher'&&!S.preview)return ownSkin()||'doodle';
  const st=curStudent();
  if(st)return SKIN_IDS.includes(st.skin)?st.skin:'doodle';
  try{const v=localStorage.getItem('kd-skin-seen');if(SKIN_IDS.includes(v))return v;}catch(e){}
  return 'doodle';}
function applySkin(){
  const s=skinOf();const root=document.documentElement;
  if(root.dataset.skin!==s){root.dataset.skin=s;syncHeader();}
  try{localStorage.setItem('kd-skin-seen',s);}catch(e){}}
function setOwnSkin(v){try{localStorage.setItem('kd-skin',v);}catch(e){}applySkin();render();}

/* ---------- settings: style, cabinet language, practice modes ---------- */
// Выключенные режимы хранятся у ученика (modes_off); пусто = включено всё. Менять могут и ученик, и учитель.
const modeOff=()=>new Set((curStudent()||{}).modes_off||[]);
const modeOn=id=>!modeOff().has(id);
const gamesOn=()=>MODES.some(m=>modeOn(m.id));
function allModes(){return[['review','Spaced review','Интервальное повторение','Words come back after 1, 3, 7, 14 and 30 days.','Слова возвращаются через 1, 3, 7, 14 и 30 дней.']]
  .concat(MODES.map(m=>[m.id,m.t,m.tr,m.d,m.dr]));}
// Сохраняет настройку у текущего ученика: сначала меняет экран, потом отправляет на сервер (при ошибке возвращает как было).
function setPref(action,patch,payload){
  const cur=curStudent();if(!cur)return;
  const prev={};for(const k in patch)prev[k]=cur[k];
  Object.assign(cur,patch);applySkin();render();
  api(action,Object.assign({student:cur.id},payload)).catch(e=>{
    Object.assign(cur,prev);applySkin();render();
    toast(L('Could not save: ','Не сохранилось: ')+(e.code==='offline'?L('no internet','нет интернета'):e.message));});}
function toggleMode(id,on){
  const off=modeOff();
  if(on)off.delete(id);else{
    if(allModes().every(m=>m[0]===id||off.has(m[0]))){toast(L('At least one mode must stay on','Хотя бы один режим должен остаться включённым'));render();return;}
    off.add(id);}
  const list=[...off];
  S.practice=null;
  setPref('setModes',{modes_off:list},{off:list});}
const asTeacher=()=>S.role==='teacher';
function swatches(cur,onPick,idp){
  const box=el('div',{class:'skinbar'});
  SKINS.forEach(([id,en,ru])=>{const name=RU()||asTeacher()?ru:en;
    box.append(el('button',{type:'button',class:'sw sw-'+id,id:idp+id,title:name,'aria-label':name,'aria-pressed':cur===id?'true':'false',onclick:()=>onPick(id)}));});
  const nm=SKINS.find(s=>s[0]===cur);
  box.append(el('span',{class:'nm'},nm?(asTeacher()?nm[2]:L(nm[1],nm[2])):''));
  return box;}
function langSeg(cur,onPick,idp){

function renderTask(h,t,ti,rec,ro){
  if(t.type==='link')return el('div',{class:'linkcard'},el('span',{class:'label'},t.title||L('Watch first','Сначала посмотрите')),t.text?el('p',null,t.text):null,el('a',{class:'btn',href:t.url,target:'_blank',rel:'noopener',style:'align-self:flex-start'},t.label||L('Open ↗','Открыть ↗')));
  const box=el('div',{class:'task',id:'task-'+ti},...taskHead(t,ti));
  const keys=keysOf(t,ti);const shown=!!rec.checked[ti]&&!rec.dirty?.[ti];
  const setVal=(k,v)=>{rec.cur[k]=v;if(!ro){touchHw(h.id);rec.dirty=rec.dirty||{};rec.dirty[ti]=true;saveHw(h.id);if(t.type==='open')maybeAutoFinish(h);}};
  const ul=el('ol',{class:'items'});
  (t.items||[]).forEach((it,ii)=>{
    const myKeys=keys.filter(k=>k.k.startsWith('t'+ti+'-i'+ii+'-')||k.k==='t'+ti+'-i'+ii);
    const li=el('li',{class:'item'});
    if(shown&&gradable(t)){const allOk=myKeys.every(k=>isRight(k,rec.cur[k.k]));li.classList.add(allOk?'good':'bad');}
    const name='r-'+h.id+'-'+ti+'-'+ii;
    if(t.type==='tf'||t.type==='choice'){
      li.append(el('p',null,(ii+1)+'. '+it.s));
      const opts=t.type==='tf'?[['T',L('True','Верно')],['F',L('False','Неверно')]]:it.o.map((o,oi)=>[String(oi),o]);
      li.append(el('div',{class:'opts'},opts.map(([v,lab])=>{const inp=el('input',{type:'radio',name,value:v,id:name+'-'+v,checked:rec.cur[myKeys[0].k]===v});
        inp.addEventListener('change',()=>setVal(myKeys[0].k,v));return el('label',{class:'opt',for:name+'-'+v},inp,lab);})));
    }else if(t.type==='gap'){
      const parts=gapParts(it.s);const line=el('p',{class:'gapline'},(ii+1)+'. ');
      parts.forEach((p,pi)=>{if(pi%2===0){line.append(p);return;}const k='t'+ti+'-i'+ii+'-g'+((pi-1)/2);
        const inp=el('input',{type:'text',id:name+'-'+pi,autocomplete:'off',autocapitalize:'off',spellcheck:'false','aria-label':L('gap','пропуск')});inp.value=rec.cur[k]||'';
        inp.addEventListener('input',()=>setVal(k,inp.value));line.append(inp);});
      li.append(line);
    }else if(t.type==='match'){
      const opts=t.options||(t.items.map(x=>x.r));
      const sel=el('select',{id:name,'aria-label':it.l},el('option',{value:''},L('— choose —','— выберите —')),opts.map(o=>el('option',{value:o,selected:rec.cur[myKeys[0].k]===o},o)));
      sel.addEventListener('change',()=>setVal(myKeys[0].k,sel.value));
      li.classList.add('match');li.append(el('p',null,el('strong',null,(ii+1)+'. '+it.l)),sel);
    }else if(t.type==='transform'||t.type==='open'){
      li.append(el('p',null,(ii+1)+'. '+it.s));
      const inp=t.type==='open'?el('textarea',{class:'txt',id:name,placeholder:it.ph||L('Write here','Напишите здесь')}):el('input',{type:'text',class:'txt',id:name,autocomplete:'off',placeholder:it.start||''});
      inp.value=rec.cur[myKeys[0].k]||'';inp.addEventListener('input',()=>setVal(myKeys[0].k,inp.value));li.append(inp);
    }
    if(shown&&gradable(t)){const wrong=myKeys.filter(k=>!isRight(k,rec.cur[k.k]));
      if(wrong.length)li.append(el('p',{class:'fix'},L('Correct answer: ','Правильно: '),wrong.map((k,i)=>[i?', ':'',el('b',null,niceAnswer(t,k))])));}
    ul.append(li);
  });
  box.append(ul);
  if(gradable(t)){
    box.append(el('div',null,el('button',{class:'btn primary',type:'button',id:'chk-'+ti,onclick:()=>{
      if(!ro){touchHw(h.id);if(!rec.checked[ti]){keys.forEach(k=>{rec.first[k.k]=rec.cur[k.k]==null?'':rec.cur[k.k];});rec.checked[ti]=true;}}
      else rec.checked[ti]=true;

function layout(cands){

  const fits=(ans,r,c,dir)=>{const dr=dir==='d'?1:0,dc=dir==='a'?1:0;let inter=0;

      if(g){if(g!==ans[i])return -1;inter++;}else if(get(rr+dc,cc+dr)||get(rr-dc,cc-dr))return -1;}
    return inter;};

  for(let pass=0;pass<2;pass++){const skipped=[];
    for(const it of rest){if(placed.length>=10){skipped.push(it);continue;}let bp=null;
      for(const p of placed)for(let i=0;i<p.ans.length;i++)for(let j=0;j<it.ans.length;j++){if(p.ans[i]!==it.ans[j])continue;

const TASK_TYPES=['gap','tf','choice','match','transform','open','link'];
function checkHomework(h,n){
  if(!h||typeof h!=='object')throw new Error('ДЗ №'+n+': не похоже на задание');
  if(!h.title)throw new Error('ДЗ №'+n+': нет названия (title)');
  if(!Array.isArray(h.tasks)||!h.tasks.length)throw new Error('«'+h.title+'»: нет заданий (tasks)');
  h.tasks.forEach((t,i)=>{if(!TASK_TYPES.includes(t.type))throw new Error('«'+h.title+'», задание '+(i+1)+': неизвестный тип «'+t.type+'»');
    if(t.type!=='link'&&(!Array.isArray(t.items)||!t.items.length))throw new Error('«'+h.title+'», задание '+(i+1)+': нет пунктов (items)');});
  return{title:String(h.title),date:/^\d{4}-\d{2}-\d{2}$/.test(h.date||'')?h.date:today(),focus:h.focus||'',tasks:h.tasks,checked:false};
}
function parseJSONish(txt){
  let t=String(txt).trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
  t=t.replace(/[\u201C\u201D]/g,'"');
  return JSON.parse(t);
}

    try{const v=parseJSONish(ta.value);items=(Array.isArray(v)?v:(v.homework?[].concat(v.homework):[v])).map((h,i)=>checkHomework(h,i+1));}
    catch(x){er.textContent=x instanceof SyntaxError?'Код вставился не целиком или с ошибкой. Скопируйте его ещё раз полностью.':x.message;return;}
    try{const r=await api('import',{coll:'homework',student:S.sid,items});S.hw.push(...r.items);ta.value='';S.open.hwj=false;toast(r.items.length===1?'ДЗ добавлено':'Добавлено ДЗ: '+r.items.length);render();}
    catch(x){er.textContent='Не сохранилось: '+(x.code==='offline'?'нет интернета':x.message);}});
  const dt=el('details',{class:'add',open:!!S.open.hwj},el('summary',null,'+ Вставить ДЗ от Claude'),f);dt.addEventListener('toggle',()=>{S.open.hwj=dt.open;});return dt;
}
function makeWord(o,lesson){
  const w={word:String(o.word||'').trim(),meaning:String(o.meaning||'').trim(),ru:String(o.ru||'').trim(),lesson:o.lesson||lesson||today()};
  let ex=String(o.cloze||o.example||'').trim();
  if(ex&&!/\{\{.+?\}\}/.test(ex)&&w.word){const core=w.word.replace(/^(to|a|an|the)\s+/i,'').split(' / ')[0].trim();
    const re=new RegExp('\\b('+core.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','i');if(re.test(ex))ex=ex.replace(re,'{{$1}}');}
  if(/\{\{.+?\}\}/.test(ex))w.cloze=ex;
  w.example=ex.replace(/\{\{(.+?)\}\}/g,(m,a)=>a.split('|')[0]);
  if(o.answer)w.answer=String(o.answer);
  return w;
}
function parseWords(txt,lesson){
  const t=String(txt).trim();if(!t)return[];
  if(/^[\[{`]/.test(t)){const v=parseJSONish(t);return[].concat(v.words||v).map(o=>makeWord(o,lesson));}
  return t.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(/\s+[—–]\s+|\s*\|\s*|\t|\s+-\s+/);
    return makeWord({word:p[0],meaning:p[1],ru:p[2],example:p.slice(3).join(' — ')},lesson);});
}
function importWordsForm(){
  const ta=el('textarea',{class:'big',id:'w-bulk',placeholder:'take off — to leave the ground — взлетать — The plane {{took off}} at six.'});
  const er=el('p',{class:'err',id:'w-bulk-err'});
  const f=el('form',{id:'f-wb'},
    el('p',{class:'small muted',style:'grid-column:1/-1'},'По одному слову в строке: слово — объяснение по-английски — перевод — пример. Или вставьте список, который подготовил Claude.'),
    el('label',{class:'full'},'Слова',ta),

    el('div',{class:'actions'},el('button',{class:'btn primary',type:'submit'},'Добавить слова')));

    const bad=items.filter(w=>!w.word||!w.meaning);
    if(!items.length){er.textContent='Список пустой.';return;}
    if(bad.length){er.textContent='Не хватает объяснения у: '+bad.map(w=>w.word||'(пустая строка)').join(', ')+'. Формат строки: слово — объяснение — перевод — пример.';return;}
    try{const r=await api('import',{coll:'words',student:S.sid,items});S.words.push(...r.items);S.lastWordDate=$('#w-bulk-date').value;ta.value='';toast('Добавлено слов: '+r.items.length);render();}
    catch(x){er.textContent='Не сохранилось: '+(x.code==='offline'?'нет интернета':x.message);}});
  const dt=el('details',{class:'add',open:!!S.open.wb},el('summary',null,'+ Вставить список слов'),f);dt.addEventListener('toggle',()=>{S.open.wb=dt.open;});return dt;

/* ---------- lessons & balance ---------- */
function ledger(){
  const byDate=(a,b)=>String(a.date).localeCompare(String(b.date))||String(a.id).localeCompare(String(b.id));
  const ls=[...S.lessons].sort(byDate);const ps=[...S.pays].sort(byDate).map(p=>Object.assign({},p,{used:[]}));
  let pi=0;const cover={};
  for(const l of ls){while(pi<ps.length&&ps[pi].used.length>=Number(ps[pi].count||0))pi++;
    if(pi<ps.length){ps[pi].used.push(l);cover[l.id]=ps[pi];}}
  const paid=ps.reduce((s,p)=>s+Number(p.count||0),0);
  return{balance:paid-ls.length,paid,lessons:ls,packages:ps,cover,unpaid:ls.filter(l=>!cover[l.id])};
}
function renderLessons(){
  const sec=el('section',{'aria-labelledby':'tab-lessons'});const T=isTeacherView();const B=ledger();
  if(T)sec.append(el('div',{class:'addrow'},addLessonForm(),addPaymentForm()));
  const neg=B.balance<0;
  const bal=el('div',{class:'balance'+(neg?' neg':'')},el('span',{class:'label'},L('Lesson balance','Баланс занятий')),
    el('span',{class:'big'+(neg?' neg':'')},signed(B.balance)+' '+(RU()?ruLessons(B.balance):(Math.abs(B.balance)===1?'lesson':'lessons'))),
    el('p',{class:'muted small'},neg?L('These lessons are not paid yet:','Эти уроки ещё не оплачены:'):B.balance===0?L('All lessons are paid. The next lesson needs a new payment.','Все уроки оплачены. Следующий урок уже в минус.'):L('Paid lessons you still have.','Оплаченные уроки, которые ещё остались.')),
    neg?el('div',{class:'chips unpaid'},B.unpaid.map(l=>el('span',null,fmtDate(l.date,true)))):null);
  sec.append(bal);
  if(!S.ready){sec.append(el('div',{class:'empty'},L('Loading…','Загрузка…')));return sec;}
  // packages
  sec.append(el('h3',null,L('Payments','Оплаты')));
  if(!B.packages.length)sec.append(el('div',{class:'empty'},L('No payments yet.','Оплат пока нет.')));
  [...B.packages].reverse().forEach(p=>{
    const left=Number(p.count||0)-p.used.length;
    const d=el('details',{class:'pk',open:!!S.open['pk'+p.id]},
      el('summary',null,el('span',{class:'plus'},'+'+nLessons(Number(p.count||0))),el('span',{class:'date'},L('paid ','оплачено ')+fmtDate(p.date)),
        el('span',{class:'pill '+(left>0?'p-doing':'p-done')},left>0?L(left+' left','осталось '+left):L('used up','использован'))),
      el('div',{class:'body'},
        el('div',{class:'meter','aria-hidden':'true'},Array.from({length:Number(p.count||0)},(_,i)=>el('i',{class:i<p.used.length?null:'free'}))),
        p.used.length?el('div',null,el('p',{class:'small muted'},L('Lessons from this payment:','Списано с этой оплаты:')),el('div',{class:'chips'},p.used.map(l=>el('span',null,fmtDate(l.date,true))))):el('p',{class:'small muted'},L('No lessons used yet.','Пока ничего не списано.')),
        p.note?el('p',{class:'small muted'},p.note):null,
        T?el('div',null,confirmBtn('Удалить оплату','Точно удалить?',()=>tWrite(()=>S.db.doc('payments/'+p.id).delete(),'Оплата удалена'),'pdel-'+p.id)):null));
    d.addEventListener('toggle',()=>{S.open['pk'+p.id]=d.open;});
    sec.append(d);
  });
  // lessons table
  sec.append(el('h3',null,L('Lessons','Проведённые занятия')));
  if(!B.lessons.length){sec.append(el('div',{class:'empty'},L('No lessons yet.','Занятий пока нет.')));return sec;}
  const tb=el('tbody');
  [...B.lessons].reverse().forEach(l=>{
    const c=B.cover[l.id];
    const tr=el('tr',null,el('td',null,fmtDate(l.date)),
      el('td',null,l.kind==='missed'?L('Missed lesson (charged)','Пропуск (списан)'):L('Lesson','Урок'),l.note?el('div',{class:'small muted'},l.note):null),
      el('td',null,c?el('span',{class:'pill p-done'},L('Paid · ','Оплачено · ')+fmtDate(c.date,true)):el('span',{class:'pill p-bad'},L('Not paid yet','Не оплачено'))));
    if(T)tr.append(el('td',null,confirmBtn('Удалить','Точно?',()=>tWrite(()=>S.db.doc('lessons/'+l.id).delete(),'Занятие удалено'),'ldel-'+l.id)));
    tb.append(tr);
  });
  sec.append(el('div',{class:'tablebox'},el('table',null,el('thead',null,el('tr',null,el('th',null,L('Date','Дата')),el('th',null,L('What','Что')),el('th',null,L('Payment','Оплата')),T?el('th',null,''):null)),tb)));
  return sec;
}
function addLessonForm(){

    el('label',null,'Дата занятия',el('input',{id:'l-date',type:'date',value:today(),required:true})),

    el('label',{class:'full'},'Заметка (видит ученик, необязательно)',el('input',{id:'l-note'})),

function addPaymentForm(){

/* ---------- Telegram ---------- */
function syncHeader(){if(!TG)return;
  const bg=getComputedStyle(document.body).backgroundColor;const m=bg.match(/\d+/g);
  if(m&&tgOK('6.9')){const hex='#'+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join('');try{TG.setHeaderColor(hex);TG.setBackgroundColor(hex);}catch(e){}}}
function applyTheme(){if(!TG)return;const dark=TG.colorScheme==='dark';document.documentElement.dataset.theme=dark?'dark':'light';syncHeader();}
if(TG){try{TG.ready();TG.expand();}catch(e){}applyTheme();
  try{TG.onEvent('themeChanged',applyTheme);}catch(e){}
  if(tgOK('7.7'))try{TG.disableVerticalSwipes();}catch(e){}
  if(tgOK('6.1'))try{TG.BackButton.onClick(()=>{
    if(S.practice){stopTimers();if(S.practice.mode&&S.practice.mode!=='review'){S.practice.mode=null;S.practice.st=null;}else S.practice=null;}
    else if(S.openHw)S.openHw=null;render();window.scrollTo(0,0);});}catch(e){}}

/* ---------- boot & refresh ---------- */
async function reload(){
  const sid=S.sid;const j=await api('load',{student:sid});if(sid!==S.sid)return;
  S.hw=j.homework||[];S.words=j.words||[];S.lessons=j.lessons||[];S.pays=j.payments||[];
  if(S.role==='teacher'){S.allProg=normProg(j.progress);S.allHw=j.hwprog||{};}
  else{if(j.student)S.student=j.student;
    if(!isPending('progress/'+S.uid))S.prog=normProg(j.progress);
    const hp=j.hwprog||{};for(const id in hp)if(!S.touched[id])S.myHw[id]=clone(hp[id]);}
  S.ready=true;safeRender();
}
async function boot(){
  if(!TG||!TG.initData){S.role='outside';S.ready=true;render();return;}
  S.role='loading';S.ready=false;render();
  try{
    const me=await api('me',{invite:(TG.initDataUnsafe||{}).start_param||''});
    S.db=DB;S.role=me.role;
    if(me.role==='teacher'){S.students=me.students||[];S.pending=me.pending||[];
      let saved=null;try{saved=localStorage.getItem('desk-sid');}catch(e){}
      S.sid=((S.students.find(s=>s.id===saved)||S.students[0])||{}).id||null;}
    else if(me.role==='student'){S.student=me.student;S.sid=S.uid=me.student.id;}
    else S.guestName=me.name||'';
    if(S.sid)await reload();
    if(S.role==='student')flushPending();
  }catch(e){S.role='error';S.err=e;}
  S.ready=true;render();
}
let lastRefresh=0;
function refresh(){if(!S.sid||document.visibilityState!=='visible'||Date.now()-lastRefresh<15000)return;lastRefresh=Date.now();
  reload().catch(()=>{});
  if(S.role==='teacher')api('me').then(m=>{S.students=m.students||S.students;S.pending=m.pending||[];safeRender();}).catch(()=>{});}
setInterval(refresh,60000);
document.addEventListener('visibilitychange',refresh);
render();
boot();
})();
